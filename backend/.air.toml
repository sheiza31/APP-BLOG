# Air configuration file
# Documentation: https://github.com/air-verse/air

# Working directory
root = "."

# Temp directory
tmp_dir = "tmp"

[build]
  # Build command
  cmd = "go build -o ./tmp/main ./cmd/"
  # Watch these extensions
  include_ext = ["go", "toml", "yaml"]
  # Exclude these directories
  exclude_dir = ["tmp", "vendor", "node_modules"]
  # Delay after file changes
  delay = 1000

[log]
  # Log time
  time = false

[color]
  # Each color represents a log level
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Delete tmp directory on exit
  clean_on_exit = true
